<header class="shell-header">
  <a class="skip-link" href="#content">{{ skipLabel() }}</a>
  <p class="shell-mark">Cro Sport Hub</p>
  <h1>Studio</h1>
  <nav class="shell-nav" aria-label="Studio sections">
    <a routerLink="/pocetna" [attr.aria-current]="ariaPocetna()">Početna</a>
    <a routerLink="/sportasi" [attr.aria-current]="ariaSportasi()">Sportaši</a>
    <a routerLink="/objave" [attr.aria-current]="ariaObjave()">Objave</a>
    <a routerLink="/postavke" [attr.aria-current]="ariaPostavke()">Postavke</a>
  </nav>
  @if (auth.session(); as session) {
  <div class="shell-session">
    <span>{{ session.id }}</span>
    <button type="button" (click)="logOut()">Log out</button>
  </div>
  }
</header>
