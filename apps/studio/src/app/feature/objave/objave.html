<div class="shell">
  <app-studio-section-header [skipLabel]="skipLabel" />

  <main id="content" class="home-main" tabindex="-1">
    <h2>{{ title }}</h2>
    <csh-ui-filter-bar
      [dayLabel]="dayLabel()"
      [sport]="sport"
      [athlete]="athlete"
      [status]="status"
      (previousDay)="onPreviousDay()"
      (nextDay)="onNextDay()"
    />
    <p class="home-lead">{{ lead }}</p>
  </main>
</div>
