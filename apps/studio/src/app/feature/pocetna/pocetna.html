<div class="shell">
  <app-studio-section-header />

  <main id="content" class="home-main" tabindex="-1">
    <h2>{{ title }}</h2>
    <csh-ui-filter-bar
      [dayLabel]="dayLabel()"
      [sport]="sport"
      [athlete]="athlete"
      [status]="status"
      (previousDay)="onPreviousDay()"
      (nextDay)="onNextDay()"
    />
    @if (showAdminOnlyMessage()) {
    <p class="home-admin-only" role="status">{{ adminOnly }}</p>
    }
    <p class="home-lead">{{ lead }}</p>
    <p>
      <button cshUiButton type="button" (click)="openDrawer()">{{ previewLabel }}</button>
    </p>
  </main>
</div>

<csh-publish-slot-drawer [open]="drawerOpen()" [slot]="harnessSlot" (closed)="closeDrawer()" />
