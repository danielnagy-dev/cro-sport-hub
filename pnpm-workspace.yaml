packages:
  - apps/*
  - libs/*

catalog:
  "@types/node": ^24
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.4.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.4.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.4.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0"
  - vite-plus@1.4.0
  - "@next/env@16.4.3"
  - "@next/swc-darwin-arm64@16.4.3"
  - "@next/swc-darwin-x64@16.4.3"
  - "@next/swc-linux-arm64-gnu@16.4.3"
  - "@next/swc-linux-arm64-musl@16.4.3"
  - "@next/swc-linux-x64-gnu@16.4.3"
  - "@next/swc-linux-x64-musl@16.4.3"
  - "@next/swc-win32-arm64-msvc@16.4.3"
  - "@next/swc-win32-x64-msvc@16.4.3"
  - next@16.4.3

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
