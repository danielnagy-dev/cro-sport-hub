name: Feature request
description: A user-facing capability that is not in the product yet
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: |
        Search open issues first. An agent files this form (goal, acceptance criteria, blocked by, size). The issue is the spec. Do not add a `.scratch` ticket.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/web
        - apps/studio
        - apps/api
        - libs/ui
        - libs/shared-types
        - docs or config
        - tooling
        - other
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The problem this solves and the outcome. This is the Goal section of the issue.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How a visitor or an editor would use it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why this one.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable checks. One checkbox per check.
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      description: Plan ids or links that must land first. Write none when nothing blocks this.
      placeholder: none
    validations:
      required: true

  - type: input
    id: size
    attributes:
      label: Size
      description: Counted lines. Target 300. Split before 500. A corrected estimate over 400 is split before it is marked ready.
      placeholder: unknown
    validations:
      required: true
