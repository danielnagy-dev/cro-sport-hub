name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: PR size
        if: github.event_name == 'pull_request'
        run: pnpm exec vpx tools/guards/pr-size.ts

      - name: Format check
        run: pnpm exec vp run format-check

      - name: Lint
        run: pnpm exec vp run lint

      - name: Typecheck
        run: pnpm exec vp run typecheck

      - name: Test
        run: pnpm exec vp run test

      - name: Build
        run: pnpm exec vp run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Verify API
        run: pnpm exec vp run verify:api
